services:
  - type: web
    name: fnb-pelanggan
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fnb-postgres
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: fnb-postgres
          property: connectionString

databases:
  - name: fnb-postgres
    plan: free
    databaseName: fnb_restoran
    user: fnb_user
